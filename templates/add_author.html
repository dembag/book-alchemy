<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Book Alchemy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <nav>
        <div class="container">
            <a href="{{ url_for('home') }}" class="logo"><h1>Book Alchemy</h1></a>
        </div>
    </nav>
    <main class="container">
        <div class="toolbar">
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="btn-small">Home</a>
            </div>
        </div>

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="form-container">
            <form action="{{ url_for('add_author') }}" class="card" method="POST">
                <label for="name">Author Name:</label>
                <input type="text" id="name" name="name" class="form-input" required>

                <label for="birthdate">Birthdate:</label>
                <input type="date" id="birthdate" name="birthdate" class="form-input" required>

                <label for="date_of_death">Date of Death:</label>
                <input type="date" id="date_of_death" name="date_of_death" class="form-input">

                <input type="submit" value="Add Author" class="btn">
            </form>
        </div>
    </main>
</body>
</html>
