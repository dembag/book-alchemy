<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Book Alchemy</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <nav>
        <div class="container">
            <a href="{{ url_for('home') }}" class="logo"><h1>Book Alchemy</h1></a>
        </div>
    </nav>

    <main class="container">
        <div class="toolbar">
            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="home">Home</a>
            </div>
        </div>

        {% if success %}
            <p class="success">{{ success }}</p>
        {% endif %}
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="form-container">
            <form action="{{ url_for('add_book') }}" class="card" method="POST">
                <label for="title">Title: </label>
                <input type="text" id="title" name="title" maxlength="300" class="form-input" required>

                <label for="author_id">Author: </label>
                <select id="author_id" name="author_id" class="form-input" required>
                    <option value="">Select Author</option>
                    {% for author in authors %}
                        <option value="{{ author.id }}">{{ author.name }}</option>
                    {% endfor %}
                </select>

                <label for="year">Year: </label>
                <input type="number" id="year" name="year" min="1000" max="2100" class="form-input">

                <label for="isbn">ISBN: </label>
                <input type="text" id="isbn" name="isbn" maxlength="20" class="form-input" required>

                <input type="submit" value="Add Book" class="btn">
            </form>
        </div>
    </main>
</body>
</html>
